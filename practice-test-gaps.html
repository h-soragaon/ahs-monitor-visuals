  <div class="stat"><div class="v">${totalStu}</div><div class="l">Students</div></div>
  <div class="stat"><div class="v">${totalExams}</div><div class="l">AP Exams</div></div>
  <div class="stat"><div class="v">${t.length}</div><div class="l">Student×Exam</div></div>
  <div class="stat"><div class="v">${avgTaken}</div><div class="l">Avg Tests Taken</div></div>
  <div class="stat"><div class="v bad">${withZero}</div><div class="l">Zero Tests</div></div>
  <div class="stat"><div class="v warn">${withPartial}</div><div class="l">Partial Results</div></div>
  <div class="stat"><div class="v warn">${withGaps}</div><div class="l">With Gaps</div></div>
`;

// Filters
const dris=[...new Set(t.map(r=>r.dri))].sort();
const exams=[...new Set(t.map(r=>r.cb_exam_name))].sort();
document.getElementById('filters').innerHTML=`
  <select class="filter" id="f-dri" onchange="applyFilters()"><option value="">All DRIs</option>${dris.map(d=>`<option>${d}</option>`).join('')}</select>
  <select class="filter" id="f-exam" onchange="applyFilters()"><option value="">All Exams</option>${exams.map(e=>`<option>${e}</option>`).join('')}</select>
  <input class="filter" id="f-text" placeholder="Search student..." oninput="applyFilters()">
`;

function applyFilters(){
  const dri=document.getElementById('f-dri').value;
  const exam=document.getElementById('f-exam').value;
  const text=document.getElementById('f-text').value.toLowerCase();
  document.querySelectorAll('#gap-table tbody tr').forEach(tr=>{
    const d=tr.dataset;
    const show=(!dri||d.dri===dri)&&(!exam||d.exam===exam)&&(!text||tr.textContent.toLowerCase().includes(text));
    tr.style.display=show?'':'none';
  });
}

// Gap Report table
let gt='<table id="gap-table"><thead><tr><th>DRI</th><th>Student</th><th>AP Exam</th><th>Status</th><th>Avail</th><th>Taken</th><th>Partial</th><th>Not Taken</th><th>Next Test</th><th>#</th><th>On TB?</th><th>Latest</th><th>Date</th><th>MCQ%</th><th>Best AP</th><th>Gaps</th></tr></thead><tbody>';
t.sort((a,b)=>a.dri.localeCompare(b.dri)||a.cb_exam_name.localeCompare(b.cb_exam_name)||a.student_name.localeCompare(b.student_name));
t.forEach(r=>{
  const zero=parseInt(r.tests_taken)===0;
  const cls=zero?' class="row-zero"':'';
  const taken=parseInt(r.tests_taken)||0;
  const partial=parseInt(r.tests_partial)||0;
  const avail=parseInt(r.tests_available)||0;
  const barW=avail?Math.round(taken/avail*80):0;
  const barP=avail?Math.round(partial/avail*80):0;
  const barR=80-barW-barP;
  const bar=`<span class="bar bar-g" style="width:${barW}px"></span><span class="bar bar-y" style="width:${barP}px"></span><span class="bar bar-r" style="width:${barR}px"></span>`;
  const gapPills=r.gaps?r.gaps.split('; ').map(g=>`<span class="pill pill-gap">${g}</span>`).join(''):'';
  const onTb=r.next_test_on_timeback==='TRUE'?'<span class="g">Yes</span>':r.next_test_on_timeback==='FALSE'?'<span class="r">No</span>':'';
  gt+=`<tr${cls} data-dri="${r.dri}" data-exam="${r.cb_exam_name}"><td style="font-size:.7rem">${r.dri}</td><td><b>${r.student_name}</b></td><td style="font-size:.7rem">${r.cb_exam_name}</td><td>${bar}</td><td>${avail}</td><td class="g">${taken}</td><td class="y">${partial}</td><td class="${parseInt(r.tests_not_taken)>0?'r':''}">${r.tests_not_taken}</td><td style="font-size:.7rem">${r.next_test_name||'<span class="g">Done</span>'}</td><td>${r.next_test_order}</td><td>${onTb}</td><td style="font-size:.7rem">${r.latest_test_name}</td><td>${r.latest_test_date}</td><td>${r.latest_mcq_pct?r.latest_mcq_pct+'%':''}</td><td>${ap(r.best_ap_score)}</td><td>${gapPills}</td></tr>`;
});
gt+='</tbody></table>';
document.getElementById('gaps').innerHTML=gt;

// DRI Summary
let dt='<table><thead><tr><th>DRI</th><th>AP Exam</th><th>Students</th><th>Tests Avail</th><th>Avg Taken</th><th>Zero Tests</th><th>Partial</th><th>Coverage</th><th>Actions</th></tr></thead><tbody>';
D.dri.sort((a,b)=>a.dri.localeCompare(b.dri)||a.cb_exam_name.localeCompare(b.cb_exam_name));
D.dri.forEach(r=>{
  const covCls=r.pct_coverage>=50?'g':r.pct_coverage>=25?'y':'r';
  dt+=`<tr><td><b>${r.dri}</b></td><td>${r.cb_exam_name}</td><td>${r.student_count}</td><td>${r.tests_available}</td><td>${r.avg_tests_taken}</td><td class="${r.students_with_zero>0?'r':''}">${r.students_with_zero}</td><td class="${r.students_with_partial>0?'y':''}">${r.students_with_partial}</td><td class="${covCls}">${r.pct_coverage}%</td><td class="${r.action_items>0?'r':''}">${r.action_items}</td></tr>`;
});
dt+='</tbody></table>';
document.getElementById('dri').innerHTML=dt;

// Test Sequence
let sq='';
Object.entries(D.sequence).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([exam,tests])=>{
  sq+=`<div style="margin-bottom:16px"><h3 style="font-size:.9rem;color:#ccc;border-bottom:1px solid #333;padding-bottom:4px">${exam} <span style="color:#888;font-size:.75rem">(${tests.length} tests)</span></h3>`;
  sq+='<table style="margin-top:4px"><thead><tr><th>#</th><th>Test Name</th><th>Source</th><th>Platform</th><th>Verified</th></tr></thead><tbody>';
  tests.forEach(t=>{
    const vCls=t.verified.toUpperCase()==='TRUE'?'g':'y';
    sq+=`<tr><td>${t.order}</td><td>${t.name}</td><td style="font-size:.7rem">${t.source}</td><td style="font-size:.7rem">${t.platform}</td><td class="${vCls}">${t.verified}</td></tr>`;
  });
  sq+='</tbody></table></div>';
});
document.getElementById('sequence').innerHTML=sq;

// Unmapped
if(D.unmapped.length){
  let um='<p style="color:#f97316;margin-bottom:8px">These Timeback courses have no big_list_ref mapping. Results from these courses cannot be linked to the test sequence.</p>';
  um+='<table><thead><tr><th>Test ID</th><th>Test Name</th><th>Exam</th><th>Section</th><th>Created By</th><th>Discovered</th></tr></thead><tbody>';
  D.unmapped.forEach(r=>{
    um+=`<tr><td style="font-size:.7rem">${r.test_id}</td><td>${r.test_name}</td><td>${r.cb_exam_name}</td><td>${r.section_type}</td><td>${r.created_by}</td><td>${r.date_discovered}</td></tr>`;
  });
  um+='</tbody></table>';
  document.getElementById('unmapped').innerHTML=um;
}else{
  document.getElementById('unmapped').innerHTML='<p class="g">All Timeback courses are mapped.</p>';
}
</script>
</body>
</html>
