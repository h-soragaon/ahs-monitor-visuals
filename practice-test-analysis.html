.bm{background:#3b82f6}.bp{background:#8b5cf6}.bg{background:#10b981}
.sv{color:#22c55e}.sp{color:#eab308}.si{color:#ef4444}
.recent{background:#0f1a0f !important}
.filter{padding:4px 8px;background:#1a1a2e;border:1px solid #333;border-radius:4px;color:#e0e0e0;font-size:.8rem;margin-bottom:8px;width:300px}
.exam-tag{display:inline-block;background:#1a1a2e;border:1px solid #333;border-radius:4px;padding:2px 6px;font-size:.65rem;margin:1px}

const tabs=['completions','students','heatmap','inventory','timeline','scores'];
const tabNames=['Completions (123)','Students (43)','Heatmap','Inventory (110)','Timeline','AP Scores'];

document.getElementById('tabbar').innerHTML=tabs.map((t,i)=>
  `<div class="tab${i===0?' active':''}" onclick="showV('${t}',this)">${tabNames[i]}</div>`
).join('');

function showV(id,el){
  document.querySelectorAll('.vw').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
}

function ap(score){
  if(!score)return'<span style="color:#444">-</span>';
  const s=parseInt(score);
  return`<span class="s${s}">${s}</span>`;
}

// Stats bar
const valid=D.c.filter(r=>r.st==='valid');
const stuSet=new Set(D.c.map(r=>r.sid));
const examSet=new Set(D.c.map(r=>r.e));
const mcqs=valid.filter(r=>r.mp);
const avgMcq=mcqs.length?mcqs.reduce((a,r)=>a+r.mp,0)/mcqs.length:0;
const withAp=valid.filter(r=>r.ap);
const avgAp=withAp.length?withAp.reduce((a,r)=>a+parseFloat(r.ap),0)/withAp.length:0;
const recent=D.c.filter(r=>r.d>='2026-04-01').length;

document.getElementById('stats').innerHTML=`
  <div class="stat"><div class="v">${D.c.length}</div><div class="l">Completions</div></div>
  <div class="stat"><div class="v">${stuSet.size}</div><div class="l">Students</div></div>
  <div class="stat"><div class="v">${examSet.size}</div><div class="l">AP Exams</div></div>
  <div class="stat"><div class="v">${valid.length}</div><div class="l">Valid</div></div>
  <div class="stat"><div class="v">${avgMcq.toFixed(1)}%</div><div class="l">Avg MCQ</div></div>
  <div class="stat"><div class="v">${avgAp.toFixed(1)}</div><div class="l">Avg AP Score</div></div>
  <div class="stat"><div class="v">${recent}</div><div class="l">Since Apr 1</div></div>
  <div class="stat"><div class="v">${D.i.reduce((a,r)=>a+r.total,0)}</div><div class="l">Inventory</div></div>`;

// 1. Completions
let ct='<input class="filter" placeholder="Filter..." oninput="filt(this,\'ctbl\')"><table id="ctbl"><thead><tr><th>Date</th><th>Student</th><th>Exam</th><th>Test</th><th>MCQ</th><th>FRQ</th><th>AP</th><th>Status</th></tr></thead><tbody>';
D.c.sort((a,b)=>b.d.localeCompare(a.d)).forEach(r=>{
  const rc=r.d>='2026-04-01'?' class="recent"':'';
  const mcq=r.mc&&r.mt?r.mc+'/'+r.mt+(r.mp?' <span style="color:#888">('+r.mp+'%)</span>':''):'';
  const frq=r.fe&&r.fp?r.fe+'/'+r.fp:'';
  ct+=`<tr${rc}><td>${r.d}</td><td>${r.s}</td><td style="font-size:.7rem">${r.e}</td><td style="font-size:.7rem">${r.t}</td><td>${mcq}</td><td>${frq}</td><td>${ap(r.ap)}</td><td class="s${r.st[0]}">${r.st}</td></tr>`;
});
ct+='</tbody></table>';
document.getElementById('completions').innerHTML=ct;

// 2. Students
const sm={};
D.c.filter(r=>r.st==='valid').forEach(r=>{
  if(!sm[r.s])sm[r.s]={n:0,ex:new Set(),ms:[],as:[],ds:[],exams:{}};
  const s=sm[r.s];s.n++;s.ex.add(r.e);if(r.mp)s.ms.push(r.mp);if(r.ap)s.as.push(parseFloat(r.ap));s.ds.push(r.d);
  if(!s.exams[r.e])s.exams[r.e]=[];s.exams[r.e].push(r);
});
let st='<table><thead><tr><th>Student</th><th>Tests</th><th>Exams</th><th>Avg MCQ%</th><th>Avg AP</th><th>Latest</th><th>Exams Taken</th></tr></thead><tbody>';
Object.entries(sm).sort((a,b)=>b[1].n-a[1].n).forEach(([name,s])=>{
  const am=s.ms.length?(s.ms.reduce((a,v)=>a+v,0)/s.ms.length).toFixed(1):'';
  const aa=s.as.length?(s.as.reduce((a,v)=>a+v,0)/s.as.length).toFixed(1):'';
  const lat=s.ds.sort().pop();
  const exTags=Object.keys(s.exams).map(e=>`<span class="exam-tag">${e.replace('AP ','')}</span>`).join('');
  st+=`<tr><td><b>${name}</b></td><td>${s.n}</td><td>${s.ex.size}</td><td>${am}</td><td>${ap(aa)}</td><td>${lat}</td><td>${exTags}</td></tr>`;
});
st+='</tbody></table>';
document.getElementById('students').innerHTML=st;

// 3. Heatmap
const allStu=[...new Set(D.c.filter(r=>r.st==='valid').map(r=>r.s))].sort();
const allEx=[...new Set(D.c.map(r=>r.e))].sort();
let hm='<div style="overflow-x:auto"><table><thead><tr><th style="min-width:140px">Student</th>';
allEx.forEach(e=>{hm+=`<th style="min-width:28px;font-size:.55rem;writing-mode:vertical-lr;transform:rotate(180deg);height:110px">${e.replace('AP ','')}</th>`;});
hm+='</tr></thead><tbody>';
allStu.forEach(name=>{
  hm+='<tr><td style="font-size:.72rem">'+name+'</td>';
  allEx.forEach(exam=>{
    const m=D.c.filter(r=>r.s===name&&r.e===exam&&r.st==='valid');
    const c=m.length;
    const cls=c>=3?'h3':c>=2?'h2':c>=1?'h1':'h0';
    const tip=m.map(r=>r.t.substring(0,40)+' '+r.d).join('&#10;');
    hm+=`<td><div class="hm ${cls}" title="${tip}">${c||''}</div></td>`;
  });
  hm+='</tr>';
});
hm+='</tbody></table></div>';
document.getElementById('heatmap').innerHTML=hm;

// 4. Inventory
const examRes={};D.c.forEach(r=>{examRes[r.e]=(examRes[r.e]||0)+1;});
let iv='<table><thead><tr><th>AP Exam</th><th>Total</th><th>Full</th><th>MCQ-only</th><th>FRQ-only</th><th>New</th><th>Completions</th></tr></thead><tbody>';
D.i.sort((a,b)=>b.total-a.total).forEach(r=>{
  iv+=`<tr><td>${r.e}</td><td><b>${r.total}</b></td><td>${r.full}</td><td>${r.mcq_only}</td><td>${r.frq_only}</td><td>${r.new||0}</td><td>${examRes[r.e]||0}</td></tr>`;
});
iv+='</tbody></table>';
document.getElementById('inventory').innerHTML=iv;

// 5. Timeline
const bw={};
D.c.filter(r=>r.d).forEach(r=>{
  const d=new Date(r.d);const ws=new Date(d);ws.setDate(d.getDate()-d.getDay());
  const k=ws.toISOString().slice(0,10);
  if(!bw[k])bw[k]={v:0,p:0,i:0,stu:new Set()};
  if(r.st==='valid')bw[k].v++;else if(r.st==='partial')bw[k].p++;else bw[k].i++;
  bw[k].stu.add(r.s);
});
let tl='<table><thead><tr><th>Week</th><th>Valid</th><th>Partial</th><th>Invalid</th><th>Students</th><th></th></tr></thead><tbody>';
Object.entries(bw).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([w,d])=>{
  const bar=`<span class="bar bm" style="width:${d.v*6}px"></span><span class="bar bp" style="width:${d.p*6}px"></span><span class="bar bg" style="width:${d.i*6}px"></span>`;
  tl+=`<tr><td>${w}</td><td>${d.v}</td><td>${d.p}</td><td>${d.i}</td><td>${d.stu.size}</td><td>${bar}</td></tr>`;
});
tl+='</tbody></table>';
document.getElementById('timeline').innerHTML=tl;

// 6. AP Scores
const scoreData={};
valid.filter(r=>r.ap).forEach(r=>{
  if(!scoreData[r.e])scoreData[r.e]=[];
  scoreData[r.e].push({s:r.s,ap:parseInt(r.ap),mcq:r.mp,t:r.t,d:r.d});
});
let sc='';
Object.entries(scoreData).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([exam,results])=>{
  const avg=(results.reduce((a,r)=>a+r.ap,0)/results.length).toFixed(1);
  const dist=[0,0,0,0,0];results.forEach(r=>dist[r.ap-1]++);
  sc+=`<div style="margin-bottom:16px"><h3 style="font-size:.9rem;color:#ccc">${exam} <span style="color:#60a5fa;font-size:.8rem">(avg ${avg})</span></h3>`;
  sc+='<div style="display:flex;gap:4px;margin:6px 0">';
  for(let i=4;i>=0;i--){
    const pct=results.length?dist[i]/results.length*100:0;
    sc+=`<div style="text-align:center"><div class="s${i+1}" style="font-size:.8rem;font-weight:700">${i+1}</div><div style="background:#1a1a2e;width:40px;height:${Math.max(2,pct*1.5)}px;border-radius:3px;margin:2px auto" class="bar bm"></div><div style="font-size:.6rem;color:#888">${dist[i]}</div></div>`;
  }
  sc+='</div>';
  sc+='<table style="margin-top:4px"><thead><tr><th>Student</th><th>AP</th><th>MCQ%</th><th>Test</th><th>Date</th></tr></thead><tbody>';
  results.sort((a,b)=>b.ap-a.ap).forEach(r=>{
    sc+=`<tr><td>${r.s}</td><td>${ap(r.ap)}</td><td>${r.mcq||''}</td><td style="font-size:.7rem">${r.t}</td><td>${r.d}</td></tr>`;
  });
  sc+='</tbody></table></div>';
});
document.getElementById('scores').innerHTML=sc;

function filt(el,id){
  const q=el.value.toLowerCase();
  document.querySelectorAll('#'+id+' tbody tr').forEach(tr=>{
    tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none';
  });
}
