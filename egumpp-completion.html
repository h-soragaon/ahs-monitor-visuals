<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eGUMPP — AHS Monitor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Inter, -apple-system, sans-serif; background: #FAFAF7; color: #1a1a1a; padding: 32px 40px; }
.header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
.subtitle { font-size: 13px; color: #888; }
.freshness { flex-shrink: 0; font-size: 12px; font-weight: 500; color: #555; background: #fff; border: 1px solid #e0e0e0; border-radius: 999px; padding: 4px 12px; }

/* Tabs */
.tabs { display: flex; gap: 0; margin-bottom: 24px; border-bottom: 1px solid #e0e0e0; }
.tab { padding: 8px 16px; font-size: 13px; font-weight: 500; color: #888; cursor: pointer; border-bottom: 2px solid transparent; }
.tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }

/* Controls */
.controls { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.controls select, .controls input { font-size: 13px; padding: 5px 10px; border: 1px solid #ddd; border-radius: 5px; background: #fff; }
.controls input[type="search"] { width: 200px; }
.count { font-size: 12px; color: #888; margin-left: auto; }

/* Table base */
table { width: auto; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #e8e8e5; font-size: 13px; }
thead { background: #f5f5f2; }
th { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.03em; color: #777; padding: 8px 12px; text-align: left; border-bottom: 1px solid #e8e8e5; }
td { padding: 7px 12px; border-bottom: 1px solid #f2f2ef; }
tr:hover { background: #fafaf7; }

/* Completion cells */
.pct { font-variant-numeric: tabular-nums; font-weight: 500; text-align: center; display: block; }
.p100 { color: #16a34a; }
.p50 { color: #2563eb; }
.p1 { color: #d97706; }
.p0 { color: #ddd; }
th.mc { text-align: center; width: 90px; }
td.mc { text-align: center; }
td.overall { font-variant-numeric: tabular-nums; font-weight: 600; text-align: center; }

/* Sortable headers */
th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
th.sortable:hover { color: #1a1a1a; }
th.sortable .arrow { opacity: 0.35; font-size: 9px; margin-left: 3px; }
th.sortable.sorted .arrow { opacity: 1; }

/* Last active / staleness */
td.last-active { font-variant-numeric: tabular-nums; color: #555; white-space: nowrap; }
.stale { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #d97706; margin-left: 6px; vertical-align: middle; }
.muted { color: #bbb; }

/* Expandable rows */
.expand-btn { cursor: pointer; user-select: none; }
.expand-btn::before { content: '\25B6'; font-size: 9px; margin-right: 6px; display: inline-block; transition: transform 0.15s; color: #999; }
.expand-btn.open::before { transform: rotate(90deg); }
.detail-row { display: none; }
.detail-row.show { display: table-row; }
.detail-row > td { padding: 0 12px 8px 32px; background: #fcfcfa; }
.detail-row table { border: none; border-radius: 0; background: transparent; margin: 4px 0; }
.detail-row thead { background: transparent; }
.detail-row th { padding: 4px 10px; font-size: 10px; }
.detail-row td { padding: 3px 10px; font-size: 12px; border-bottom: 1px solid #f0f0ec; }

/* Learning data table */
.status-completed { color: #16a34a; font-weight: 500; }
.status-retesting { color: #d97706; font-weight: 500; }
.status-inprogress { color: #2563eb; font-weight: 500; }

/* Page visibility */
.page { display: none; }
.page.active { display: block; }
</style>
</head>

const summary = DATA.summary;
const lessons = DATA.lessons;

// --- Tabs ---
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('page-' + tab.dataset.page).classList.add('active');
  });
});

// --- Completion Page ---
const STALE_DAYS = 14;  // idle threshold for the staleness flag
let sortKey = 'name';
let sortDir = 1;  // 1 asc, -1 desc

function pctSpan(v) {
  if (v >= 100) return `<span class="pct p100">100%</span>`;
  if (v >= 50) return `<span class="pct p50">${Math.round(v)}%</span>`;
  if (v > 0) return `<span class="pct p1">${Math.round(v)}%</span>`;
  return `<span class="pct p0"></span>`;
}

function lastActiveCell(d) {
  if (!d.last_active) return `<td class="last-active muted">—</td>`;
  const stale = (d.idle !== null && d.idle > STALE_DAYS)
    ? `<span class="stale" title="Idle ${d.idle} days"></span>` : '';
  return `<td class="last-active">${d.last_active}${stale}</td>`;
}

function lessonDetailTable(name) {
  const studentLessons = lessons[name] || {};
  const mods = Object.keys(studentLessons).sort();
  let rows = '';
  for (const m of mods) {
    for (const l of studentLessons[m]) {
      rows += `<tr><td>M${m}</td><td>${l.l}</td>`
        + `<td class="${statusClass(l.s)}">${l.s || ''}</td>`
        + `<td>${l.g ? l.g + '%' : ''}</td><td>${l.d || ''}</td>`
        + `<td>${l.t && l.t !== '0' ? l.t + 'm' : ''}</td></tr>`;
    }
  }
  if (!rows) rows = `<tr><td colspan="6" class="muted">No lesson data</td></tr>`;
  return `<table><thead><tr><th>Mod</th><th>Lesson</th><th>Status</th>`
    + `<th>Grade</th><th>Completed</th><th>Time</th></tr></thead><tbody>`
    + rows + `</tbody></table>`;
}

function sortData(data) {
  return data.slice().sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (sortKey === 'idle') {
      // Unknown activity sorts last regardless of direction
      av = (av === null) ? Infinity : av;
      bv = (bv === null) ? Infinity : bv;
    }
    if (typeof av === 'string') {
      return sortDir * av.localeCompare(bv);
    }
    return sortDir * (av - bv);
  });
}

function renderCompletion() {
  const grade = document.getElementById('gradeFilter').value;
  const progress = document.getElementById('progressFilter').value;
  const search = document.getElementById('searchCompletion').value.toLowerCase();

  let data = summary;
  if (grade !== 'all') data = data.filter(d => d.grade === grade);
  if (progress === 'active') data = data.filter(d => d.m1 > 0 || d.m2 > 0 || d.m3 > 0 || d.m4 > 0);
  if (search) data = data.filter(d => d.name.toLowerCase().includes(search));
  data = sortData(data);

  document.getElementById('tbodyCompletion').innerHTML = data.map((d, i) =>
    `<tr data-row="${i}"><td><span class="expand-btn" data-row="${i}"></span></td>`
    + `<td>${d.name}</td><td>${d.grade}</td>`
    + `<td class="mc">${pctSpan(d.m1)}</td><td class="mc">${pctSpan(d.m2)}</td>`
    + `<td class="mc">${pctSpan(d.m3)}</td><td class="mc">${pctSpan(d.m4)}</td>`
    + `<td class="overall">${Math.round(d.overall)}%</td>`
    + lastActiveCell(d) + `</tr>`
    + `<tr class="detail-row" data-detail="${i}"><td colspan="9">`
    + lessonDetailTable(d.name) + `</td></tr>`
  ).join('');
  document.getElementById('countCompletion').textContent = data.length + ' students';

  // Wire expand toggles
  document.querySelectorAll('#tbodyCompletion .expand-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = btn.dataset.row;
      const detail = document.querySelector(`#tbodyCompletion .detail-row[data-detail="${i}"]`);
      btn.classList.toggle('open');
      detail.classList.toggle('show');
    });
  });

  // Reflect sort state in header arrows
  document.querySelectorAll('#page-completion th.sortable').forEach(th => {
    const arrow = th.querySelector('.arrow');
    if (th.dataset.sort === sortKey) {
      th.classList.add('sorted');
      arrow.textContent = sortDir === 1 ? '\u25B2' : '\u25BC';
    } else {
      th.classList.remove('sorted');
      arrow.textContent = '';
    }
  });
}

// Wire sortable headers
document.querySelectorAll('#page-completion th.sortable').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    if (sortKey === key) {
      sortDir *= -1;
    } else {
      sortKey = key;
      // Percentages/idle default to most-relevant-first
      sortDir = (key === 'name' || key === 'grade') ? 1 : -1;
    }
    renderCompletion();
  });
});

// --- Learning Data Page ---
function statusClass(s) {
  if (s === 'Completed') return 'status-completed';
  if (s === 'Retesting') return 'status-retesting';
  if (s === 'In Progress') return 'status-inprogress';
  return '';
}

function renderLearning() {
  const grade = document.getElementById('gradeFilter2').value;
  const mod = document.getElementById('moduleFilter').value;
  const status = document.getElementById('statusFilter').value;
  const search = document.getElementById('searchLearning').value.toLowerCase();

  let rows = [];
  for (const s of summary) {
    if (grade !== 'all' && s.grade !== grade) continue;
    if (search && !s.name.toLowerCase().includes(search)) continue;
    const studentLessons = lessons[s.name] || {};
    for (const [m, lessonList] of Object.entries(studentLessons)) {
      if (mod !== 'all' && m !== mod) continue;
      for (const l of lessonList) {
        if (status === 'empty' && l.s) continue;
        if (status !== 'all' && status !== 'empty' && l.s !== status) continue;
        rows.push({ name: s.name, grade: s.grade, mod: m, ...l });
      }
    }
  }

  // Cap at 500 for performance
  const capped = rows.slice(0, 500);
  document.getElementById('tbodyLearning').innerHTML = capped.map(r =>
    `<tr><td>${r.name}</td><td>${r.grade}</td><td>M${r.mod}</td><td>${r.l}</td><td class="${statusClass(r.s)}">${r.s || ''}</td><td>${r.g ? r.g + '%' : ''}</td><td>${r.d || ''}</td><td>${r.t && r.t !== '0' ? r.t + 'm' : ''}</td></tr>`
  ).join('');
  document.getElementById('countLearning').textContent = rows.length + ' rows' + (rows.length > 500 ? ' (showing 500)' : '');
}

document.getElementById('gradeFilter').addEventListener('change', renderCompletion);
document.getElementById('progressFilter').addEventListener('change', renderCompletion);
document.getElementById('searchCompletion').addEventListener('input', renderCompletion);
document.getElementById('gradeFilter2').addEventListener('change', renderLearning);
document.getElementById('moduleFilter').addEventListener('change', renderLearning);
document.getElementById('statusFilter').addEventListener('change', renderLearning);
document.getElementById('searchLearning').addEventListener('input', renderLearning);

renderCompletion();
renderLearning();
</script>
