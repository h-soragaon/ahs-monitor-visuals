<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AHS Academic Calendar 2025-27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#fafaf7;
  --panel:#ffffff;
  --panel-alt:#fcfcfa;
  --ink:#1a1a1f;
  --muted:#6b6b76;
  --faint:#a1a1aa;
  --line:#ececea;
  --line-soft:#f4f4f2;
  --line-strong:#dcdcd8;
  --zero:#c8c8c8;
  --accent: oklch(0.52 0.13 265);
  --accent-soft: oklch(0.96 0.02 265);

  /* harmonized session palette — equal chroma/lightness, hue varies */
  --s1: oklch(0.55 0.13 265);   /* indigo  */
  --s2: oklch(0.55 0.13 305);   /* violet  */
  --s3: oklch(0.6 0.11 215);    /* blue    */
  --s4: oklch(0.6 0.12 155);    /* green   */
  --s5: oklch(0.66 0.12 80);    /* amber   */

  /* event palette — soft tinted blocks, reuse AP-score family */
  --apexam-chip: oklch(0.58 0.16 25);
  --appr-bg: oklch(0.97 0.035 25); --appr-bd: oklch(0.88 0.06 25); --appr-fg: oklch(0.5 0.14 25);
  --satoff-chip: oklch(0.66 0.13 60);
  --satpr-bg: oklch(0.975 0.04 95); --satpr-bd: oklch(0.88 0.06 95); --satpr-fg: oklch(0.52 0.1 80);
  --holiday-bg: oklch(0.965 0.045 95); --holiday-tint: oklch(0.98 0.025 95);
  --break-bg:#f3f3f0; --break-bd:#e2e2dd; --break-fg:#7c7c84;
  --neutral-bg:#f1f1ee; --neutral-bd:#e4e4df; --neutral-fg:#5f5f68;
}
* { box-sizing:border-box; }
html, body { margin:0; padding:0; min-height:100%; background:var(--bg); }
body { font-family:'Inter', -apple-system, system-ui, sans-serif; color:var(--ink); }

.page { padding:20px 36px 24px; max-width:1320px; margin:0 auto; }

h1.title { font-size:22px; font-weight:600; margin:0 0 3px; letter-spacing:-0.015em; }
p.sub { font-size:12.5px; color:var(--muted); margin:0 0 14px; }
.rule { height:1px; background:var(--line); margin:0 0 16px; }

/* KPI strip */
.kpi-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; margin-bottom:16px; }
.stat { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 18px; }
.stat .num { font-size:26px; font-weight:600; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; line-height:1.05; }
.stat .num small { font-size:16px; color:var(--faint); font-weight:500; }
.stat .lbl { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.07em; font-weight:500; margin-top:8px; }
.stat.hero { background:var(--ink); color:#fafaf7; border-color:var(--ink); }
.stat.hero .num { font-size:24px; }
.stat.hero .lbl { color:#9b9ba5; }
.stat.milestone .num { font-size:19px; font-weight:600; letter-spacing:-0.01em; line-height:1.2;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* toolbar */
.toolbar { display:flex; align-items:center; gap:14px; margin-bottom:12px; flex-wrap:wrap; }
.btn { font-family:inherit; border:1px solid var(--line-strong); background:var(--panel); color:var(--ink); font-size:13px; font-weight:500; border-radius:8px; padding:8px 14px; cursor:pointer; transition:border-color 0.15s, color 0.15s; }
.btn:hover { border-color:var(--accent); color:var(--accent); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.primary:hover { color:#fff; filter:brightness(1.05); }
.btn.icon { width:36px; height:36px; padding:0; display:inline-flex; align-items:center; justify-content:center; font-size:16px; color:var(--muted); }
.nav-group { display:flex; gap:6px; }
.period { font-size:20px; font-weight:600; letter-spacing:-0.01em; margin:0 4px; min-width:230px; }
.ctx-pill { font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; padding:5px 11px; border-radius:6px; background:var(--break-fg); color:#fff; }
.ctx-pill.s1 { background:var(--s1); } .ctx-pill.s2 { background:var(--s2); } .ctx-pill.s3 { background:var(--s3); }
.ctx-pill.s4 { background:var(--s4); } .ctx-pill.s5 { background:var(--s5); }
.ctx-pill.break { background:var(--break-fg); }
.spacer { flex:1; }

.seg { display:flex; gap:2px; background:var(--line); padding:3px; border-radius:8px; font-size:12px; }
.seg button { border:none; background:transparent; padding:6px 14px; border-radius:6px; cursor:pointer; color:var(--muted); font-family:inherit; font-weight:500; font-variant-numeric:tabular-nums; }
.seg button.on { background:var(--panel); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,0.06); }
select.month-sel { font-family:inherit; font-size:13px; font-weight:500; color:var(--ink); border:1px solid var(--line-strong); background:var(--panel); border-radius:8px; padding:8px 12px; cursor:pointer; }

/* status banner (loading / error) */
.status-banner { margin-bottom:18px; padding:11px 15px; border-radius:10px; font-size:13px; border:1px solid; line-height:1.5; }
.status-banner code { background:rgba(0,0,0,0.05); padding:1px 5px; border-radius:4px; font-size:12px; }
.status-banner.loading { background:var(--panel-alt); border-color:var(--line); color:var(--muted); }
.status-banner.error { background:var(--appr-bg); border-color:var(--appr-bd); color:var(--appr-fg); }

/* calendar shell */
.cal { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }

/* ===== MONTH ===== */
.dow { display:grid; grid-template-columns:repeat(7,1fr); background:var(--panel-alt); border-bottom:1px solid var(--line); }
.dow > div { padding:9px 16px; font-size:11px; font-weight:600; color:var(--faint); text-transform:uppercase; letter-spacing:0.08em; }
.grid { display:grid; grid-template-columns:repeat(7,1fr); }
.cell { min-height:90px; border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft); padding:8px 10px 8px 12px; position:relative; cursor:pointer; transition:background 0.1s; }
.cell:hover { background:var(--panel-alt); }
.cell:nth-child(7n) { border-right:none; }
.grid > .cell:nth-last-child(-n+7) { border-bottom:none; }
.cell .sbar { position:absolute; left:0; top:0; bottom:0; width:4px; }
.cell.s1 .sbar{background:var(--s1);} .cell.s2 .sbar{background:var(--s2);} .cell.s3 .sbar{background:var(--s3);} .cell.s4 .sbar{background:var(--s4);} .cell.s5 .sbar{background:var(--s5);}
.cell.brk { background:var(--break-bg); }
.cell.wknd { background:var(--panel-alt); }
.cell.brk.wknd { background:var(--break-bg); }
.cell.today { box-shadow: inset 0 0 0 2px var(--accent); }
.cell .dn { font-size:13px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
.cell.today .dn { color:var(--accent); }
.cell.other .dn { color:var(--zero); font-weight:500; }
.cell .evs { margin-top:5px; display:flex; flex-direction:column; gap:3px; }
.chip { font-size:10.5px; font-weight:500; line-height:1.25; padding:3px 7px; border-radius:5px; border:1px solid transparent; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chip.apexam { background:var(--apexam-chip); color:#fff; }
.chip.appr { background:var(--appr-bg); border-color:var(--appr-bd); color:var(--appr-fg); }
.chip.satoff { background:var(--satoff-chip); color:#fff; }
.chip.satpr { background:var(--satpr-bg); border-color:var(--satpr-bd); color:var(--satpr-fg); }
.chip.holiday { background:var(--holiday-bg); border-color:oklch(0.86 0.06 95); color:var(--satpr-fg); }
.chip.brk { background:#eceae5; border-color:var(--break-bd); color:var(--break-fg); }
.chip.neutral { background:var(--neutral-bg); border-color:var(--neutral-bd); color:var(--neutral-fg); }
.chip.session { background:var(--accent-soft); border-color:oklch(0.9 0.04 265); color:var(--accent); }

/* ===== WEEK ===== */
.weekmeta { display:flex; gap:26px; padding:14px 18px; border-bottom:1px solid var(--line); background:var(--panel-alt); font-size:12.5px; color:var(--muted); flex-wrap:wrap; }
.weekmeta b { color:var(--ink); font-weight:600; }
.weekgrid { display:grid; grid-template-columns:repeat(7,1fr); }
.wcol { border-right:1px solid var(--line-soft); min-height:440px; display:flex; flex-direction:column; }
.wcol:nth-child(7) { border-right:none; }
.wcol.holiday { background:var(--holiday-tint); }
.wcol.brk { background:var(--break-bg); }
.wcol.today { box-shadow: inset 0 0 0 2px var(--accent); }
.wcol .whd { text-align:center; padding:14px 8px 10px; border-bottom:1px solid var(--line-soft); }
.wcol .wdow { font-size:11px; font-weight:600; color:var(--faint); text-transform:uppercase; letter-spacing:0.08em; }
.wcol .wnum { font-size:30px; font-weight:600; letter-spacing:-0.02em; margin-top:4px; font-variant-numeric:tabular-nums; }
.wcol.today .wnum { color:var(--accent); }
.wcol.dim .wnum, .wcol.dim .wdow { color:var(--zero); }
.wcol .wbody { flex:1; padding:12px 10px; display:flex; flex-direction:column; gap:8px; }
.wcol .foot { padding:10px; font-size:11px; color:var(--faint); }
.wev { border-radius:7px; padding:9px 11px; border-left:3px solid var(--neutral-bd); background:var(--neutral-bg); }
.wev .t { font-size:12.5px; font-weight:600; color:var(--ink); }
.wev .d { font-size:11px; color:var(--muted); margin-top:2px; }
.wev.apexam { background:var(--appr-bg); border-left-color:var(--apexam-chip); }
.wev.apexam .t { color:var(--appr-fg); }
.wev.appr { background:var(--appr-bg); border-left-color:var(--apexam-chip); }
.wev.appr .t { color:var(--appr-fg); }
.wev.satoff { background:var(--satpr-bg); border-left-color:var(--satoff-chip); }
.wev.satoff .t { color:var(--satpr-fg); }
.wev.satpr { background:var(--satpr-bg); border-left-color:var(--satpr-bd); }
.wev.satpr .t { color:var(--satpr-fg); }
.wev.holiday { background:var(--holiday-bg); border-left-color:oklch(0.86 0.06 95); }
.wev.holiday .t { color:var(--satpr-fg); }
.wev.session { background:var(--accent-soft); border-left-color:var(--accent); }
.wev.session .t { color:var(--accent); }
.wev.brk { background:#eceae5; border-left-color:var(--break-fg); }
.wev.brk .t { color:var(--break-fg); }

.hidden { display:none; }

/* legend */
.legend { display:flex; flex-wrap:wrap; align-items:center; gap:7px 18px; margin-top:14px; padding:11px 18px; background:var(--panel); border:1px solid var(--line); border-radius:12px; }
.lg { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
.lg .swab { width:5px; height:16px; border-radius:3px; }
.lg .box { width:18px; height:14px; border-radius:4px; border:1px solid transparent; }
.lg .box.appr { background:var(--appr-bg); border-color:var(--appr-bd); }
.lg .box.apexam { background:var(--apexam-chip); }
.lg .box.satoff { background:var(--satoff-chip); }
.lg .box.satpr { background:var(--satpr-bg); border-color:var(--satpr-bd); }
.lg .box.holiday { background:var(--holiday-bg); border-color:oklch(0.86 0.06 95); }
.lg .box.brk { background:#eceae5; border-color:var(--break-bd); }
</style>
</head>
<body>
<div class="page">
  <h1 class="title">AHS Academic Calendar</h1>
  <p class="sub">Alpha High School 2025&ndash;26 &amp; 2026&ndash;27 &middot; 5 sessions / 37 instruction weeks per year</p>
  <div class="rule"></div>

  <div class="kpi-grid" id="stats-bar"></div>

  <div class="toolbar">
    <button class="btn primary" onclick="goToday()">Today</button>
    <div class="nav-group">
      <button class="btn icon" onclick="goPrev()" aria-label="Previous">&#8249;</button>
      <button class="btn icon" onclick="goNext()" aria-label="Next">&#8250;</button>
    </div>
    <span class="period" id="period"></span>
    <span class="ctx-pill" id="ctxpill"></span>
    <span class="spacer"></span>
    <div class="seg" id="year-seg"></div>
    <select class="month-sel" id="month-select" onchange="jumpToMonth(this.value)"></select>
    <div class="seg" id="view-seg">
      <button class="on" data-view="month" onclick="setView('month')">Month</button>
      <button data-view="week" onclick="setView('week')">Week</button>
    </div>
  </div>

  <div id="status-banner" class="status-banner" style="display:none"></div>

  <!-- MONTH -->
  <div class="cal" id="view-month">
    <div class="dow"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>
    <div class="grid" id="month-grid"></div>
  </div>

  <!-- WEEK -->
  <div class="cal hidden" id="view-week">
    <div class="weekmeta" id="week-meta"></div>
    <div class="weekgrid" id="week-grid"></div>
  </div>

  <div class="legend">
    <div class="lg"><span class="swab" style="background:var(--s1)"></span>Session 1</div>
    <div class="lg"><span class="swab" style="background:var(--s2)"></span>Session 2</div>
    <div class="lg"><span class="swab" style="background:var(--s3)"></span>Session 3</div>
    <div class="lg"><span class="swab" style="background:var(--s4)"></span>Session 4</div>
    <div class="lg"><span class="swab" style="background:var(--s5)"></span>Session 5</div>
    <div class="lg"><span class="box apexam"></span>AP Exam / Window</div>
    <div class="lg"><span class="box appr"></span>AP Practice</div>
    <div class="lg"><span class="box satoff"></span>SAT Official</div>
    <div class="lg"><span class="box satpr"></span>SAT Practice</div>
    <div class="lg"><span class="box holiday"></span>Holiday / No School</div>
    <div class="lg"><span class="box brk"></span>Session Break</div>
  </div>
</div>

<script>
// Calendar data — loaded at runtime from calendar_data.json (see bootstrap at bottom)
let CAL_DATA = [];

// Build lookup (populated in bootstrap once data loads)
let dayMap = {};

// Timezone-safe date helpers
function dateStr(d) {
  // Always use LOCAL date components — never toISOString (which is UTC)
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function parseLocalDate(s) {
  // Parse "YYYY-MM-DD" as local date at noon (avoids DST edge cases)
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d, 12, 0, 0);
}
function dayOfDate(s) {
  // Extract day number from "YYYY-MM-DD" string directly — no Date parsing needed
  return parseInt(s.slice(8), 10);
}

// State
let currentView = 'month'; // 'month' | 'week'
let currentDate = new Date(); // today for navigation
const TODAY = dateStr(new Date());

// "Session 3" -> 3 (for session-color classes); null otherwise.
function sessionNum(ses) {
  const m = (ses || '').match(/Session (\d)/);
  return m ? Number(m[1]) : null;
}

const AP_SUBJECT_NAMES = {
  'Bio': 'AP Biology', 'Micro': 'AP Microeconomics', 'Chem': 'AP Chemistry',
  'HuGeo': 'AP Human Geography', 'USGov': 'AP US Government',
  'EngLit': 'AP English Literature', 'Physics1': 'AP Physics 1',
  'WorldHist': 'AP World History', 'Stats': 'AP Statistics',
  'APUSH': 'AP US History', 'CalcAB': 'AP Calculus AB', 'CalcBC': 'AP Calculus BC',
  'MusicTheory': 'AP Music Theory', 'Psych': 'AP Psychology',
  'EngLang': 'AP English Language', 'EnvSci': 'AP Env Science', 'CSA': 'AP CS A',
};

function formatMonth(date) {
  return date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
}

function formatWeekRange(startDate) {
  const end = new Date(startDate);
  end.setDate(end.getDate() + 6);
  const opts = { month: 'short', day: 'numeric' };
  return `${startDate.toLocaleDateString('en-US', opts)} – ${end.toLocaleDateString('en-US', opts)}, ${end.getFullYear()}`;
}

function getMonday(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = date.getDate() - day + (day === 0 ? -6 : 1);
  return new Date(date.getFullYear(), date.getMonth(), diff, 12, 0, 0);
}

function parseEvents(et) {
  if (!et) return [];
  return et.split(';').map(tag => {
    if (tag === 'sat_official') return { type: 'sat-official', label: 'SAT Official Test' };
    if (tag === 'sat_practice') return { type: 'sat-practice', label: 'SAT Practice Test' };
    if (tag === 'ap_practice') return { type: 'ap-practice', label: 'AP Practice Test' };
    if (tag === 'ap_window') return { type: 'ap-window', label: 'AP Exams' };
    if (tag.startsWith('ap_exam:')) {
      const subjects = tag.slice(8).split(',');
      return { type: 'ap-exam', label: subjects.map(s => AP_SUBJECT_NAMES[s] || s).join(', '), subjects };
    }
    return null;
  }).filter(Boolean);
}

// Academic year ("2026-27") that a YYYY-MM-DD date belongs to (Aug -> Jul).
function academicYearOf(ds) {
  const [y, m] = ds.split('-').map(Number);
  const start = m >= 8 ? y : y - 1;
  return `${start}-${String(start + 1).slice(2)}`;
}
// Display form with an en-dash ("2025–26").
function ayDisplay(ay) { return ay.replace('-', '–'); }

function daysBetween(fromDs, toDs) {
  return Math.round((parseLocalDate(toDs) - parseLocalDate(fromDs)) / 86400000);
}

// Classify a free-text note into a chip/event style.
function noteClass(n) {
  if (/Break/i.test(n)) return 'brk';
  if (/No School|Holiday|Memorial|MLK|Labou?r|Thanksgiving/i.test(n)) return 'holiday';
  if (/Session|First Day|Last Day/i.test(n)) return 'session';
  return 'neutral';
}

// Notable calendar events (session edges, breaks, holidays, testing windows),
// deduped to the first day of each run. Drives the "Next Milestone" stat card.
function cleanMilestone(note) {
  return note
    .replace(/\s*\/\s*PM Staff Meetings.*$/i, '')   // "Session 2 Ends / PM Staff Meetings"
    .replace(/\s*;\s*Staff Meetings.*$/i, '')        // "Session Break; Staff Meetings"
    .replace(/\s*;.*$/, '')                          // any other "; ..." trailer
    .replace(/^(First Day of School|Last Day of School)\s*\/.*$/i, '$1')  // drop "/ Session N ..."
    .replace(/^Thanksgiving Day$/i, 'Thanksgiving Break')  // collapse Day into the Break run
    .trim();
}
// A date's milestone label, drawn from its note (preferred) or its event tag.
function milestoneLabel(d) {
  const re = /Session|Break|MAP|Testing|No School|Holiday|MLK|Memorial|Labor|Labour|Thanksgiving|First Day|Last Day/i;
  const n = d.n || '';
  if (n && re.test(n)) return cleanMilestone(n);
  const et = d.et || '';
  if (et.includes('ap_window') || et.includes('ap_exam')) return 'AP Exams';
  if (et.includes('sat_official')) return 'SAT Test Day';
  return null;
}
let MILESTONES = null;
function buildMilestones() {
  if (MILESTONES) return MILESTONES;
  const out = [];
  let prevLabel = null;
  CAL_DATA.forEach(d => {
    const label = milestoneLabel(d);
    if (label) {
      if (label !== prevLabel) { out.push({ d: d.d, label }); prevLabel = label; }
    } else {
      prevLabel = null;
    }
  });
  MILESTONES = out;
  return out;
}

function renderStats() {
  const today = dayMap[TODAY];
  const yr = academicYearOf(TODAY);

  // Scope school-day math to the CURRENT academic year only.
  const yearDays = CAL_DATA.filter(d => academicYearOf(d.d) === yr);
  const schoolDaysLeft = yearDays.filter(d => d.sd && d.d > TODAY).length;
  const instrTotal = yearDays.reduce((m, d) => Math.max(m, d.iw || 0), 0);
  // Instruction week reached so far this year (current if in session, else last passed).
  const instrNow = yearDays.filter(d => d.d <= TODAY).reduce((m, d) => Math.max(m, d.iw || 0), 0);

  const nextMilestone = buildMilestones().find(m => m.d > TODAY);

  let html = '';
  html += `<div class="stat hero"><div class="num">${today ? (today.ses || 'Break') : '—'}</div><div class="lbl">Current session</div></div>`;
  html += `<div class="stat"><div class="num">${instrNow ? `${instrNow}<small>&nbsp;/&nbsp;${instrTotal}</small>` : '—'}</div><div class="lbl">Instruction week</div></div>`;
  html += `<div class="stat"><div class="num">${schoolDaysLeft}</div><div class="lbl">School days left &middot; ${ayDisplay(yr)}</div></div>`;
  if (nextMilestone) {
    const n = daysBetween(TODAY, nextMilestone.d);
    const when = n === 0 ? 'today' : n === 1 ? 'in 1 day' : `in ${n} days`;
    html += `<div class="stat milestone"><div class="num">${nextMilestone.label}</div><div class="lbl">Next milestone &middot; ${when}</div></div>`;
  } else {
    html += `<div class="stat milestone"><div class="num">—</div><div class="lbl">Next milestone</div></div>`;
  }
  document.getElementById('stats-bar').innerHTML = html;
}

// Set the toolbar period label + session context pill.
function setPeriod(label, ses) {
  document.getElementById('period').textContent = label;
  const pill = document.getElementById('ctxpill');
  const sn = sessionNum(ses);
  pill.className = 'ctx-pill' + (sn ? ' s' + sn : ' break');
  pill.textContent = ses || 'Break';
}

function renderMonthView() {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  const firstDay = new Date(year, month, 1);

  // Find Monday of the first week
  let startDay = new Date(firstDay);
  const dow = startDay.getDay();
  startDay.setDate(startDay.getDate() - (dow === 0 ? 6 : dow - 1));

  // Period label + context pill (session at mid-month).
  const midData = dayMap[dateStr(new Date(year, month, 15))];
  setPeriod(formatMonth(currentDate), midData ? midData.ses : '');

  let html = '';
  let cursor = new Date(startDay);
  for (let i = 0; i < 42; i++) {
    const ds = dateStr(cursor);
    const data = dayMap[ds];
    const isOtherMonth = cursor.getMonth() !== month;

    const classes = ['cell'];
    const sn = data ? sessionNum(data.ses) : null;
    if (sn) classes.push('s' + sn);
    if (data && data.we) classes.push('wknd');
    if (data && !data.sd && !data.we && data.n && /Break/i.test(data.n)) classes.push('brk');
    if (isOtherMonth) classes.push('other');
    if (ds === TODAY) classes.push('today');

    let evs = '';
    if (data && !isOtherMonth) {
      const events = parseEvents(data.et);
      events.forEach(ev => {
        if (ev.type === 'ap-exam') {
          ev.subjects.forEach(s => { evs += `<div class="chip apexam">${AP_SUBJECT_NAMES[s] || s}</div>`; });
        } else if (ev.type === 'ap-window') {
          evs += `<div class="chip apexam">AP Exams</div>`;
        } else if (ev.type === 'ap-practice') {
          evs += `<div class="chip appr">AP Practice</div>`;
        } else if (ev.type === 'sat-official') {
          evs += `<div class="chip satoff">SAT Test Day</div>`;
        } else if (ev.type === 'sat-practice') {
          evs += `<div class="chip satpr">SAT Practice</div>`;
        }
      });
      // Note chip (only when no event tag occupies the cell).
      if (data.n && !data.et) {
        evs += `<div class="chip ${noteClass(data.n)}">${data.n}</div>`;
      }
    }

    html += `<div class="${classes.join(' ')}" data-date="${ds}" onclick="clickDay('${ds}')">`
      + `<span class="sbar"></span><div class="dn">${cursor.getDate()}</div>`
      + `<div class="evs">${evs}</div></div>`;
    cursor.setDate(cursor.getDate() + 1);

    // Stop after 5 weeks if the 6th row would be entirely next month.
    if (i >= 34 && cursor.getMonth() !== month) break;
  }
  document.getElementById('month-grid').innerHTML = html;
}

function renderWeekView() {
  const monday = getMonday(currentDate);

  const weekDays = [];
  const cursor = new Date(monday);
  for (let i = 0; i < 7; i++) {
    const ds = dateStr(cursor);
    weekDays.push({ date: ds, data: dayMap[ds] || null });
    cursor.setDate(cursor.getDate() + 1);
  }

  // Summary (from the first day in the week that has data).
  const firstData = (weekDays.find(w => w.data) || {}).data || null;
  const session = firstData ? firstData.ses : '';
  const iw = firstData ? firstData.iw : 0;
  const sdw = firstData ? firstData.sdw : 0;
  const cw = firstData ? firstData.cw : 0;
  const weekEvents = weekDays.filter(w => w.data && w.data.et).length;

  setPeriod(formatWeekRange(monday), session);

  let meta = '';
  meta += `<span>Session: <b>${session || 'Break'}</b></span>`;
  meta += `<span>Instruction week: <b>${iw || '—'}</b></span>`;
  meta += `<span>Calendar week: <b>${cw || '—'}</b></span>`;
  meta += `<span>School days: <b>${sdw || 0}</b></span>`;
  if (weekEvents > 0) meta += `<span>Events: <b>${weekEvents}</b></span>`;
  document.getElementById('week-meta').innerHTML = meta;

  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let html = '';
  weekDays.forEach((wd, i) => {
    const data = wd.data;
    const classes = ['wcol'];
    if (i >= 5) classes.push('dim');
    if (data && !data.sd && !data.we && data.n && /Break/i.test(data.n)) classes.push('brk');
    else if (data && !data.sd && !data.we && data.n) classes.push('holiday');
    if (wd.date === TODAY) classes.push('today');

    let body = '';
    if (data) {
      const events = parseEvents(data.et);
      events.forEach(ev => {
        if (ev.type === 'ap-exam') {
          ev.subjects.forEach(s => { body += `<div class="wev apexam"><div class="t">${AP_SUBJECT_NAMES[s] || s}</div><div class="d">AP Exam &bull; 8:00 AM</div></div>`; });
        } else if (ev.type === 'ap-window') {
          body += `<div class="wev apexam"><div class="t">AP Exams</div><div class="d">AP exam window &bull; subjects TBD</div></div>`;
        } else if (ev.type === 'ap-practice') {
          body += `<div class="wev appr"><div class="t">AP Practice Test</div><div class="d">Full-length practice exam</div></div>`;
        } else if (ev.type === 'sat-official') {
          body += `<div class="wev satoff"><div class="t">SAT Test Day</div><div class="d">Official College Board administration</div></div>`;
        } else if (ev.type === 'sat-practice') {
          body += `<div class="wev satpr"><div class="t">SAT Practice Test</div><div class="d">Full-length Bluebook practice</div></div>`;
        }
      });
      if (data.n) {
        body += `<div class="wev ${noteClass(data.n)}"><div class="t">${data.n}</div></div>`;
      }
    }

    let foot = '';
    if (data && data.sd) foot = 'School day';
    else if (data && !data.we) foot = 'No school';

    html += `<div class="${classes.join(' ')}">`
      + `<div class="whd"><div class="wdow">${dayNames[i]}</div><div class="wnum">${dayOfDate(wd.date)}</div></div>`
      + `<div class="wbody">${body}</div>`
      + (foot ? `<div class="foot">${foot}</div>` : '')
      + `</div>`;
  });
  document.getElementById('week-grid').innerHTML = html;
}

// --- Navigation controls: academic-year toggle + per-year month dropdown ---
const MONTH_NAMES = ['January','February','March','April','May','June',
  'July','August','September','October','November','December'];

// Distinct academic years present in the data, in chronological order.
let ACADEMIC_YEARS = [];
function computeAcademicYears() {
  const seen = new Set();
  ACADEMIC_YEARS = [];
  CAL_DATA.forEach(d => {
    const ay = academicYearOf(d.d);
    if (!seen.has(ay)) { seen.add(ay); ACADEMIC_YEARS.push(ay); }
  });
}

function currentAcademicYear() {
  return academicYearOf(dateStr(currentDate));
}

// One segmented pill per academic year. Picking a year jumps to a sensible month
// within it: today if today falls in that year, otherwise the year's first month.
function buildYearToggle() {
  const el = document.getElementById('year-seg');
  if (!el) return;
  el.innerHTML = ACADEMIC_YEARS
    .map(ay => `<button data-year="${ay}" onclick="selectYear('${ay}')">${ayDisplay(ay)}</button>`)
    .join('');
}

function firstDateOfAcademicYear(ay) {
  const days = CAL_DATA.filter(d => academicYearOf(d.d) === ay);
  return days.length ? days[0].d : null;
}

function selectYear(ay) {
  if (ay === currentAcademicYear()) return;
  const target = (academicYearOf(TODAY) === ay) ? TODAY : firstDateOfAcademicYear(ay);
  if (!target) return;
  currentDate = parseLocalDate(target);
  if (currentView === 'week') setView('month');  // setView() re-renders
  else render();
}

// Month dropdown scoped to the selected academic year only (Aug -> Jun, etc.).
function buildMonthSelect() {
  const sel = document.getElementById('month-select');
  if (!sel) return;
  const ay = currentAcademicYear();
  const months = [];
  const seen = new Set();
  CAL_DATA.forEach(d => {
    if (academicYearOf(d.d) !== ay) return;
    const key = d.d.slice(0, 7);  // YYYY-MM
    if (!seen.has(key)) { seen.add(key); months.push(key); }
  });
  sel.innerHTML = months.map(key => {
    const [y, m] = key.split('-').map(Number);
    return `<option value="${y}-${String(m).padStart(2, '0')}">${MONTH_NAMES[m - 1]} ${y}</option>`;
  }).join('');
}

function jumpToMonth(value) {
  const [y, m] = value.split('-').map(Number);
  currentDate = new Date(y, m - 1, 1, 12, 0, 0);
  // Jumping by month is a month-view action; switch the view if needed.
  if (currentView === 'week') setView('month');  // setView() re-renders
  else render();
}

// Keep the year pills + month dropdown in sync with currentDate. The month list
// is year-scoped, so rebuild it whenever the active year changes.
let _syncedYear = null;
function syncControls() {
  const ay = currentAcademicYear();
  document.querySelectorAll('#year-seg button').forEach(b =>
    b.classList.toggle('on', b.dataset.year === ay));
  if (ay !== _syncedYear) { buildMonthSelect(); _syncedYear = ay; }
  const sel = document.getElementById('month-select');
  if (sel) sel.value = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;
}

function render() {
  renderStats();
  if (currentView === 'month') {
    renderMonthView();
  } else {
    renderWeekView();
  }
  syncControls();
}

function setView(view) {
  currentView = view;
  document.querySelectorAll('#view-seg button').forEach(b =>
    b.classList.toggle('on', b.dataset.view === view));
  document.getElementById('view-month').classList.toggle('hidden', view !== 'month');
  document.getElementById('view-week').classList.toggle('hidden', view !== 'week');
  render();
}

function goToday() {
  currentDate = new Date();
  render();
}

function goPrev() {
  if (currentView === 'month') {
    currentDate.setMonth(currentDate.getMonth() - 1);
  } else {
    currentDate.setDate(currentDate.getDate() - 7);
  }
  render();
}

function goNext() {
  if (currentView === 'month') {
    currentDate.setMonth(currentDate.getMonth() + 1);
  } else {
    currentDate.setDate(currentDate.getDate() + 7);
  }
  render();
}

function clickDay(ds) {
  currentDate = parseLocalDate(ds);
  setView('week');
}

// Keyboard nav (no-op until data has loaded)
document.addEventListener('keydown', e => {
  if (!CAL_DATA.length) return;
  if (e.key === 'ArrowLeft') goPrev();
  if (e.key === 'ArrowRight') goNext();
  if (e.key === 'm') setView('month');
  if (e.key === 'w') setView('week');
  if (e.key === 't') goToday();
});

// --- Bootstrap: load data from JSON, then build controls and render. ---
function showBanner(kind, html) {
  const el = document.getElementById('status-banner');
  el.className = 'status-banner ' + kind;
  el.innerHTML = html;
  el.style.display = 'block';
}
function hideBanner() {
  document.getElementById('status-banner').style.display = 'none';
}

async function init() {
  showBanner('loading', 'Loading calendar data…');
  let data;
  try {
    const res = await fetch('calendar_data.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  } catch (err) {
    // file:// opens can't fetch (browser CORS on local files); guide the user.
    const isFileProto = location.protocol === 'file:';
    showBanner('error', isFileProto
      ? 'This page loads its data with <code>fetch()</code>, which browsers block when opened directly from disk (<code>file://</code>). Serve the folder instead — e.g. <code>python -m http.server</code> in <code>ahs-visuals/</code>, then open <code>http://localhost:8000/academic-calendar.html</code>.'
      : `Could not load <code>calendar_data.json</code> (${err.message}).`);
    return;
  }
  if (!Array.isArray(data) || !data.length) {
    showBanner('error', 'calendar_data.json was empty or malformed.');
    return;
  }

  CAL_DATA = data;
  dayMap = {};
  CAL_DATA.forEach(d => { dayMap[d.d] = d; });
  computeAcademicYears();
  buildYearToggle();

  hideBanner();
  render();
}

init();
</script>
